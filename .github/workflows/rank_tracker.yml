name: 順位チェック

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  rank-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Google認証トークン復元
        env:
          GOOGLE_TOKEN: ${{ secrets.GOOGLE_TOKEN }}
        run: echo "$GOOGLE_TOKEN" | base64 -d > token.pickle

      - name: 順位チェック実行
        run: python rank_tracker_fast.py
